[tasks.test]
description = "Run the Jest suite"
run = "npm test"

[tasks.test_e2e]
description = "Run the Playwright e2e suite (not CI-gated; requires ../speechwave checked out)"
run = "npm run test:e2e"

[tasks.dev_on]
description = "Turn on dev mode"
run = "bin/dev_mode_on"

[tasks.dev_off]
description = "Turn off dev mode"
run = "bin/dev_mode_off"
